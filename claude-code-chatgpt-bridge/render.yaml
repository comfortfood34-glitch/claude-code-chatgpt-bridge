services:
  - type: web
    name: claude-code-chatgpt-bridge
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CLAUDE_ROUTINE_FIRE_URL
        sync: false
      - key: CLAUDE_ROUTINE_TOKEN
        sync: false
      - key: BRIDGE_ACCESS_TOKEN
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: JOB_RUNNING_TIMEOUT_MS
        value: "1200000"
